name: Server 2019 V3 bundled ConPTY

on:
  push:
    branches: [server-2019-package-debug]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: windows
          is_self_hosted: false
          install_test_deps: false
          install_release_deps: true

      - name: Apply and verify Server 2019 bundled ConPTY patch
        shell: pwsh
        run: |
          git apply script/windows/server2019-split-conpty.patch
          git apply script/windows/server2019-split-conpty-fixup.patch
          git diff --check
          Select-String -Path app/src/terminal/local_tty/windows/conpty_api.rs -Pattern 'BUNDLED_CONPTY_MIN_WINDOWS_BUILD'
          $source = Get-Content app/src/terminal/local_tty/windows/conpty_api.rs -Raw
          if ($source -notmatch 'BUNDLED_CONPTY_MIN_WINDOWS_BUILD: u32 = 17763') { exit 1 }
          cargo clean -p warp --target x86_64-pc-windows-msvc

      - name: Ensure protoc
        shell: pwsh
        run: |
          if (-not (Get-Command protoc.exe -ErrorAction SilentlyContinue)) {
            winget install -e --id Google.Protobuf --accept-package-agreements --accept-source-agreements
            $p = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Microsoft\WinGet\Packages') -Filter protoc.exe -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($p) {
              $p.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              $env:PATH = "$($p.DirectoryName);$env:PATH"
            }
          }
          protoc --version

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            winget install -e --id JRSoftware.InnoSetup --accept-package-agreements --accept-source-agreements
          }
          "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build installer
        id: bundle
        shell: pwsh
        run: ./script/windows/bundle.ps1 -DEBUG_BUILD -CHANNEL oss -ARCH x64 -RELEASE_TAG "v0.0.0-server2019-v3-bundled"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: warp-oss-server2019-v3-bundled-x64
          path: ${{ steps.bundle.outputs.installer_path }}
          retention-days: 7
          if-no-files-found: error
