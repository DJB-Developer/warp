name: Package Windows Server 2019 test build

on:
  push:
    branches:
      - server-2019-package
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build Warp OSS x64 installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Prepare Windows release environment
        uses: ./.github/actions/prepare_environment
        with:
          target_os: windows
          is_self_hosted: false
          install_test_deps: false
          install_release_deps: true

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            winget install -e --id JRSoftware.InnoSetup --accept-package-agreements --accept-source-agreements
          }
          "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Build unsigned Warp OSS installer
        id: bundle
        shell: pwsh
        run: ./script/windows/bundle.ps1 -CHANNEL oss -ARCH x64 -RELEASE_TAG "v0.$env:GITHUB_SHA"

      - name: Upload Server 2019 test installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: warp-oss-server2019-x64
          path: ${{ steps.bundle.outputs.installer_path }}
          retention-days: 7
          if-no-files-found: error
